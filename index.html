<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal EFS · Walden Dos</title>
<link rel="icon" href="logo.png">
<style>
:root{--azul:#1b3a6b;--verde:#2e9e6a;--naranja:#f08a24;--fondo:#f4f6fa;--txt:#1d2433;--gris:#6b7385}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--txt)}
header{background:var(--azul);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 24px}
header img{width:44px;height:44px;border-radius:10px;background:#fff}
header h1{font-size:20px;margin:0}header small{opacity:.8;display:block}
header .der{margin-left:auto;display:flex;gap:10px;align-items:center}
main{max-width:1050px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:18px}
.login{max-width:420px;margin:40px auto}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid #ccd2de;border-radius:10px;font-size:16px}
button{background:var(--verde);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer}
button.sec{background:#ffffff22;border:1px solid #fff8}
.err{color:#c0392b;font-size:14px;min-height:18px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.kpi{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.kpi b{font-size:28px;display:block;color:var(--azul)}.kpi span{color:var(--gris);font-size:13px}
h2{font-size:18px;margin:0 0 12px;color:var(--azul)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef0f4}
th{color:var(--gris);font-weight:600}tr.clic{cursor:pointer}tr.clic:hover{background:#f6f8fc}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e7f5ee;color:var(--verde);font-weight:600}
.pill.no{background:#fdeeee;color:#c0392b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.nota{color:var(--gris);font-size:13px}.demo{background:var(--naranja);color:#fff;text-align:center;padding:6px;font-size:13px}
a{color:var(--azul)}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demostración · datos de ejemplo</div>
<header><img src="logo.png" alt="EFS"><div><h1>Portal EFS</h1><small>Educación Física · Walden Dos</small></div><div class="der" id="usuario"></div></header>
<main id="app"></main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
